name: Build and Publish Docker Images

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 3w-labs/winggo

jobs:
  # arm64 단일 플랫폼. 배포 대상(OCI Ampere)과 개발 환경이 모두 arm64 이므로
  # amd64 는 빌드하지 않는다. amd64 가 필요해지면
  # docs/operations/PRODUCTION_DEPLOY_HANDOFF.md 의 복구 절차를 따른다.
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      # slim 실패가 운영이 사용하는 full 배포를 끌어내리지 않게 한다
      fail-fast: false
      matrix:
        include:
          - variant: full
            dockerfile: Dockerfile
            latest_tag: latest
          - variant: slim
            dockerfile: Dockerfile.slim
            latest_tag: slim-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # arm64 러너는 SSD 14GB 인데 최종 이미지가 12GB대다. builder 스테이지와
      # mode=max 캐시가 겹치면 부족할 수 있어, 쓰지 않는 사전 설치 도구를 비우고
      # 남은 공간을 로그에 남긴다. 첫 실행에서 이 수치를 보고 판단한다.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          docker image prune -af || true
          echo "--- 정리 후 ---"
          df -h / | tail -1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.latest_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ matrix.variant }}
          # scope 는 variant 로 유지한다. 기존 멀티플랫폼 빌드가 같은 scope 에 arm64
          # 레이어를 이미 export 했고, QEMU 였는지 네이티브였는지는 캐시 키에 영향이 없다.
          # scope 를 바꾸면 첫 빌드가 전부 cold miss 가 되고 10GB 한도에서 기존 캐시를
          # 축출한다.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
